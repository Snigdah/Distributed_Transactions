server:
  port: 8082
  error:
    include-message: always   # show our error text (e.g. "Not enough stock")

spring:
  application:
    name: inventory-service   # name in Eureka. Feign uses this name.

  # ---------- Database ----------
  # PostgreSQL (now)
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: postgres
    password: 12345

  # Oracle (later) - only change these 3 lines, nothing in the code:
  #  datasource:
  #    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
  #    username: inventory_db      # in Oracle, one user = one schema
  #    password: your_password

  jpa:
    hibernate:
      ddl-auto: create   # POC: tables are re-created on every start
    defer-datasource-initialization: true   # create tables first, then run data.sql
  sql:
    init:
      mode: always                           # load starting data from data.sql

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ---------- Seata (AT mode) ----------
seata:
  application-id: inventory-service
  tx-service-group: poc-tx-group        # our transaction group name
  service:
    vgroup-mapping:
      poc-tx-group: default              # group -> Seata cluster "default"
    grouplist:
      default: 192.168.10.56:18091       # Seata server address
  registry:
    type: file                           # no Nacos: use the address above
  config:
    type: file
  data-source-proxy-mode: AT             # Seata wraps the DataSource and writes undo_log
